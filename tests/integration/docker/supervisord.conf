; Supervisord config for the keepassxc container.
;
; Brings up, in order:
;   1. Xvfb on :1                  — virtual X server
;   2. fluxbox                     — lightweight WM (so KeePassXC dialogs draw correctly)
;   3. x11vnc                      — VNC server pointing at :1
;   4. websockify (novnc)          — exposes the VNC stream on :6080 as a web UI
;   5. keepassxc                   — the actual app
;
; supervisord runs in the foreground (-n in CMD) so the container's PID 1 is it.

[supervisord]
nodaemon=true
user=kpxc
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x800x24 -ac +extension RANDR
autorestart=true
priority=10
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb.err

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":1",HOME="/home/kpxc"
autorestart=true
priority=20
startsecs=2
stdout_logfile=/tmp/fluxbox.log
stderr_logfile=/tmp/fluxbox.err

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -nopw -forever -shared -rfbport 5900 -quiet
autorestart=true
priority=30
startsecs=2
stdout_logfile=/tmp/x11vnc.log
stderr_logfile=/tmp/x11vnc.err

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=40
startsecs=2
stdout_logfile=/tmp/novnc.log
stderr_logfile=/tmp/novnc.err

[program:keepassxc]
command=/usr/local/bin/entrypoint-keepassxc.sh
environment=DISPLAY=":1",HOME="/home/kpxc",XDG_RUNTIME_DIR="/run/user/1000"
autorestart=true
priority=50
startsecs=5
stdout_logfile=/tmp/keepassxc.log
stderr_logfile=/tmp/keepassxc.err
